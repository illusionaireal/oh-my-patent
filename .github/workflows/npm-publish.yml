# One verified tagged build feeds independent npm and Release-asset jobs.
# npm still uses NPM_TOKEN; Trusted Publishing requires separate registry setup.
name: Publish Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate npm publication without publishing packages or uploading Release assets
        type: boolean
        default: true
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected commit
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Setup Node.js
        id: node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Validate release tag and version
        id: release-context
        run: |
          if [[ "$DRY_RUN" == "true" ]]; then
            npm run publish:release -- validate --dry-run
          else
            npm run publish:release -- validate
          fi
      - name: Check destination Release exists
        id: release-destination
        if: env.DRY_RUN != 'true'
        run: gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --json tagName > /dev/null
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Install dependencies
        id: dependencies
        run: npm ci
      - name: Type-check
        id: lint
        run: npm run lint
      # `npm test` 会先触发 `pretest` → `npm run build`（REQ-044）。
      - name: Test
        id: tests
        run: npm test
      - name: Verify generated Skill
        id: generated-skill
        run: git diff --exit-code -- skills/oh-my-patent
      - name: Build the immutable release candidates
        id: package
        run: npm run package:skill
      - name: Test tarball and ZIP
        id: archives
        run: npm run verify:artifacts
      - name: Upload verified artifacts
        id: artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-release
          path: release-artifacts/
          retention-days: 7
          if-no-files-found: error

  publish-npm:
    name: Publish plugin to npm
    needs: build
    runs-on: ubuntu-latest
    environment: PRE
    concurrency:
      group: npm-publish-oh-my-patent
      cancel-in-progress: false
    steps:
      - name: Checkout verified commit
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Download verified release artifacts
        id: artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-release
          path: release-artifacts
      - name: Setup Node.js
        id: node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
          registry-url: https://registry.npmjs.org/
      - name: Publish verified plugin tarball
        id: publish
        run: |
          if [[ "$DRY_RUN" == "true" ]]; then
            npm run publish:release -- plugin --dry-run
          else
            npm run publish:release -- plugin
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-skill:
    name: Publish standalone Skill to npm
    needs: build
    runs-on: ubuntu-latest
    environment: PRE
    concurrency:
      group: npm-publish-oh-my-patent-skill
      cancel-in-progress: false
    steps:
      - name: Checkout verified commit
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Download verified release artifacts
        id: artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-release
          path: release-artifacts
      - name: Setup Node.js for npm
        id: node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
          registry-url: https://registry.npmjs.org/
      - name: Publish verified Skill tarball
        id: publish
        run: |
          if [[ "$DRY_RUN" == "true" ]]; then
            npm run publish:skill -- --dry-run
          else
            npm run publish:skill
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-assets:
    name: Attach verified archives to Release
    needs: build
    if: github.event_name == 'release' || !inputs.dry_run
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout verified commit
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Download verified release artifacts
        id: artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-release
          path: release-artifacts
      - name: Setup Node.js
        id: node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Upload missing Release assets
        id: upload
        run: npm run publish:release -- assets
        env:
          GH_TOKEN: ${{ github.token }}

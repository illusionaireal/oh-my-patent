# Optional Action upgrade smoke test, separate from the main CI and publication.
name: Test Action artifact transfer

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/test-action-artifacts.yml

permissions:
  contents: read

concurrency:
  group: action-artifact-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify artifact transfer
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        id: node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        id: dependencies
        run: npm ci
      - name: Build
        id: build
        run: npm run build
      - name: Verify generated Skill is current
        id: generated-skill
        run: git diff --exit-code -- skills/oh-my-patent
      - name: Build release artifacts
        id: package
        run: npm run package:skill
      - name: Verify archives
        id: archives
        run: npm run verify:artifacts
      - name: Upload test archives
        id: upload-archives
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-action-test-${{ matrix.os }}
          path: release-artifacts/
          retention-days: 1
          if-no-files-found: error
      - name: Download test archives
        id: download-archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-action-test-${{ matrix.os }}
          path: ${{ runner.temp }}/verified-action-test-artifacts
      - name: Verify downloaded archive identity and checksums
        id: artifact-transfer
        run: |
          node --input-type=module -e "
            import { join } from 'node:path';
            import { publicationContext, verifiedRelease } from './scripts/release-publication.mjs';
            const root = process.cwd();
            const artifacts = join(process.env.RUNNER_TEMP, 'verified-action-test-artifacts');
            const verified = verifiedRelease(root, artifacts, publicationContext(root, true));
            console.log(JSON.stringify({ status: 'verified', files: verified.files.length }));
          "

# 持续集成：PR 与 push 上的构建 / 类型检查 / 测试（REQ-046 / DEC-4）
#
# 存在的理由：在此之前全仓库唯一的 workflow 只监听 `release: [created]` 与
# `workflow_dispatch`，而 `CONTRIBUTING.md` 与 `docs/specs/README.md` 都写着
# 「PR 会跑检查」—— 那是一句**虚假声明**（H2）。本文件让该声明成立。
#
# 范围刻意收窄（RK-5）：只跑 build / lint / test，**不碰发布**，避免消耗额度
# 与误发布。发布链路仍归 `npm-publish.yml`。

name: CI

on:
  pull_request:
  push:
    branches: [master]

# 默认最小权限：本作业只需要读代码（REQ-045）。
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        id: node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # 22 = `package.json` `engines.node` 的下限，与发布链路一致（REQ-037）。
          # 不跑 18/20 矩阵：`ink@^7` 自身要求 >=22，且这两个版本从未被实测过 ——
          # 摆一个必然为红的矩阵等于又造一句未经核实的声明。
          node-version: 22
          cache: npm
      - name: Install dependencies
        id: dependencies
        run: npm ci
      - name: Type-check
        id: lint
        run: npm run lint
      # `npm test` 会先触发 `pretest` → `npm run build`（REQ-044），
      # 因此这里不需要再单独跑一次 build。
      - name: Test
        id: tests
        run: npm test
      - name: Verify generated Skill is current
        id: generated-skill
        run: git diff --exit-code -- skills/oh-my-patent
      - name: Build release artifacts
        id: package
        run: npm run package:skill
      - name: Test plugin and standalone Skill tarballs and ZIP
        id: archives
        run: npm run verify:artifacts
      - name: Upload CI archives
        id: upload-archives
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-ci-${{ matrix.os }}
          path: release-artifacts/
          retention-days: 1
          if-no-files-found: error
      - name: Download CI archives
        id: download-archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-ci-${{ matrix.os }}
          path: ${{ runner.temp }}/verified-ci-artifacts
      - name: Verify downloaded archive identity and checksums
        id: artifact-transfer
        run: |
          node --input-type=module -e "
            import { join } from 'node:path';
            import { publicationContext, verifiedRelease } from './scripts/release-publication.mjs';
            const root = process.cwd();
            const artifacts = join(process.env.RUNNER_TEMP, 'verified-ci-artifacts');
            const verified = verifiedRelease(root, artifacts, publicationContext(root, true));
            console.log(JSON.stringify({ status: 'verified', files: verified.files.length }));
          "
      - name: Dry-run standalone Skill publication
        id: skill-publication
        run: npm run publish:skill -- --dry-run
      - name: Dry-run plugin publication
        id: plugin-publication
        run: npm run publish:release -- plugin --dry-run
      - name: Dry-run Release attachment validation
        id: release-attachments
        run: npm run publish:release -- assets --dry-run

# Manual Skill-only supplement to automatic publication in npm-publish.yml.
name: Publish standalone Skill

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate publication without uploading to npm
        type: boolean
        default: true
        required: true

permissions:
  contents: read

concurrency:
  group: standalone-skill-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify standalone Skill
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected commit
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Setup Node.js
        id: node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Validate release tag and version
        id: release-context
        run: |
          if [[ "$SKILL_DRY_RUN" == "true" ]]; then
            npm run publish:release -- validate --dry-run
          else
            npm run publish:release -- validate
          fi
        env:
          SKILL_DRY_RUN: ${{ inputs.dry_run }}
      - name: Install dependencies
        id: dependencies
        run: npm ci
      - name: Type-check
        id: lint
        run: npm run lint
      - name: Test and build
        id: tests
        run: npm test
      - name: Verify generated Skill is current
        id: generated-skill
        run: git diff --exit-code -- skills/oh-my-patent
      - name: Build immutable release candidates
        id: package
        run: npm run package:skill
      - name: Verify actual archives and standalone runtime
        id: archives
        run: npm run verify:artifacts
      - name: Upload verified artifacts
        id: artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-standalone-skill
          path: release-artifacts/
          retention-days: 7
          if-no-files-found: error

  publish-skill:
    name: Publish only the standalone Skill
    needs: build
    runs-on: ubuntu-latest
    environment: PRE
    concurrency:
      group: npm-publish-oh-my-patent-skill
      cancel-in-progress: false
    steps:
      - name: Checkout verified commit
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Download verified artifacts
        id: artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-standalone-skill
          path: release-artifacts
      - name: Setup Node.js for npm
        id: node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
          registry-url: https://registry.npmjs.org/
      - name: Publish verified Skill tarball
        id: publish
        run: |
          if [[ "$SKILL_DRY_RUN" == "true" ]]; then
            npm run publish:skill -- --dry-run
          else
            npm run publish:skill
          fi
        env:
          SKILL_DRY_RUN: ${{ inputs.dry_run }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
